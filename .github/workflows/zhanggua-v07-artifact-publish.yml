name: Publish ZhangGua v0.7 Verified Artifact

on:
  push:
    branches: ["main"]
    paths: [".zhanggua-v07-artifact-url"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release host
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and verify signed artifact
        shell: bash
        run: |
          set -euo pipefail
          URL=$(tr -d '\r\n' < .zhanggua-v07-artifact-url)
          test -n "$URL"
          curl -fL --retry 3 --retry-delay 2 "$URL" -o /tmp/ZhangGua-v0.7-verified.zip
          mkdir -p dist
          unzip -o /tmp/ZhangGua-v0.7-verified.zip -d dist
          test -s dist/ZhangGua-v0.7-release.apk
          test -s dist/ZhangGuaAndroid-v0.7-source.zip
          unzip -t dist/ZhangGua-v0.7-release.apk >/dev/null
          EXPECTED='f7ff8b35686cd4cf40f56b3b66deb2e721104bbee94e2c30c19e4c97221fad55'
          ACTUAL=$(sha256sum dist/ZhangGua-v0.7-release.apk | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED"
          echo "APK_SHA256=$ACTUAL" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view zhanggua-v0.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh release delete zhanggua-v0.7 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create zhanggua-v0.7 \
            dist/ZhangGua-v0.7-release.apk \
            dist/ZhangGuaAndroid-v0.7-source.zip \
            dist/sha256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "掌卦 Android v0.7 · Gesture Safe" \
            --notes "v0.7：进一步适配全面屏手势导航底部安全区；结果页按钮由单字改为经文/解卦/历史；体验入口更名为设置并合并 AI 设置；修复投掷动画中第二、第三枚硬币被压扁/畸变的问题，三枚硬币始终保持圆形；AI 设置新增 OpenAI、DeepSeek、Gemini、通义千问、Kimi 与自定义服务商下拉，选择预设后自动填入兼容接口、推荐模型与协议，同时仍允许手动修改模型及读取模型列表。继续沿用 v0.6 正式签名，可直接覆盖升级。APK SHA-256: $APK_SHA256"

      - name: Publish update metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p zhanggua
          cat > zhanggua/latest.json <<EOF
          {
            "versionCode": 7,
            "versionName": "0.7.0",
            "title": "掌卦 v0.7 可用",
            "notes": "适配全面屏手势底部安全区；统一设置与 AI 配置；修复三枚铜钱显示；新增常用 AI 服务商下拉。",
            "releasePage": "https://github.com/Ryyus/Ryyus.github.io/releases/tag/zhanggua-v0.7",
            "apkUrl": "https://github.com/Ryyus/Ryyus.github.io/releases/download/zhanggua-v0.7/ZhangGua-v0.7-release.apk",
            "sha256": "$APK_SHA256"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zhanggua/latest.json
          git diff --cached --quiet || git commit -m 'Publish ZhangGua v0.7 update metadata'
          git push origin main

      - name: Verify public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view zhanggua-v0.7 --repo "$GITHUB_REPOSITORY" --json url,tagName,name,assets
          mkdir -p /tmp/public-release
          gh release download zhanggua-v0.7 --repo "$GITHUB_REPOSITORY" --pattern 'ZhangGua-v0.7-release.apk' --dir /tmp/public-release
          ACTUAL=$(sha256sum /tmp/public-release/ZhangGua-v0.7-release.apk | awk '{print $1}')
          test "$ACTUAL" = "$APK_SHA256"
