name: Temporary ZhangGua Release Builder

on:
  push:
    branches: ["main"]
    paths: [".zhanggua-release-trigger"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.event_name == 'push' || github.head_ref == 'build/zhanggua-releases'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release payload
        uses: actions/checkout@v4
        with:
          ref: build/zhanggua-releases
          path: payload

      - name: Checkout verified v0.3 build payload
        uses: actions/checkout@v4
        with:
          repository: Ryyus/Nanako-discordChatBot
          ref: build/zhanggua-v0.3
          path: base

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Reconstruct v0.3 source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/v03 dist
          cat base/zhanggua-build/chunk-*.b64 | base64 -d > /tmp/zhanggua-v03.tar.xz
          tar -xJf /tmp/zhanggua-v03.tar.xz -C work/v03
          test -f work/v03/app/src/main/java/com/zhanggua/app/MainActivity.java
          test -f work/v03/app/src/main/res/raw/zhouyi.json

      - name: Build and verify v0.3
        shell: bash
        run: |
          set -euxo pipefail
          cd work/v03
          gradle clean assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -5
          cp app/build/outputs/apk/debug/app-debug.apk ../../dist/ZhangGua-v0.3-debug.apk
          cd ../..
          (cd work/v03 && zip -qr ../../dist/ZhangGuaAndroid-v0.3-source.zip . -x '*/build/*' '.gradle/*' 'local.properties')
          unzip -t dist/ZhangGua-v0.3-debug.apk >/dev/null
          sha256sum dist/ZhangGua-v0.3-debug.apk

      - name: Prepare v0.4 source
        shell: bash
        run: |
          set -euxo pipefail
          cp -a work/v03 work/v04
          rm -rf work/v04/app/build work/v04/.gradle
          cd work/v04
          patch -p1 < ../../payload/zhanggua-release/mainactivity-v04.patch
          cp ../../payload/zhanggua-release/AudioEngine.java app/src/main/java/com/zhanggua/app/AudioEngine.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          s=s.replace('versionCode 3','versionCode 4').replace("versionName '0.3.0'","versionName '0.4.0'")
          p.write_text(s)
          p=Path('app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.VIBRATE' not in s:
              s=s.replace('<uses-permission android:name="android.permission.INTERNET" />','<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />')
          p.write_text(s)
          PY

      - name: Generate ritual audio assets
        shell: bash
        run: |
          python3 - <<'PY'
          import wave, math, random, struct, os
          out='work/v04/app/src/main/res/raw'; os.makedirs(out,exist_ok=True); SR=22050
          def write(name,samples):
              mx=max(1,max(abs(x) for x in samples)); scale=.82*32767/mx
              vals=[max(-32767,min(32767,int(x*scale))) for x in samples]
              with wave.open(os.path.join(out,name),'wb') as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(SR)
                  w.writeframes(b''.join(struct.pack('<h',v) for v in vals))
          def env(t,d,a=.005,r=.06):
              if t<a: return t/a
              if t>d-r: return max(0,(d-t)/r)
              return 1
          def tone(freq,dur,harmonics=(1,)):
              return [sum((1/h)*math.sin(2*math.pi*freq*h*(i/SR)) for h in harmonics)*env(i/SR,dur) for i in range(int(SR*dur))]
          def mix(parts,dur):
              arr=[0.0]*int(SR*dur)
              for off,wav,g in parts:
                  st=int(off*SR)
                  for i,x in enumerate(wav):
                      if st+i<len(arr): arr[st+i]+=x*g
              return arr
          write('boot.wav',mix([(0,tone(420,.12,(1,2,3)),.8),(.13,tone(720,.16,(1,2)),.7)],.33))
          n=int(SR*.18); coin=[]
          for i in range(n):
              t=i/SR; d=math.exp(-25*t)
              x=(math.sin(2*math.pi*1550*t)+.55*math.sin(2*math.pi*2480*t)+.3*math.sin(2*math.pi*3320*t))*d
              x+=random.uniform(-1,1)*math.exp(-45*t)*.35; coin.append(x)
          write('coin.wav',coin)
          write('settle.wav',mix([(0,tone(260,.10,(1,2,4)),.7),(.03,tone(520,.08,(1,3)),.25)],.14))
          write('complete.wav',mix([(0,tone(330,.13,(1,2)),.55),(.09,tone(495,.14,(1,2)),.5),(.18,tone(660,.18,(1,2)),.45)],.39))
          PY

      - name: Build and verify v0.4
        shell: bash
        run: |
          set -euxo pipefail
          cd work/v04
          gradle clean assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/v04-badging.txt | head -5
          grep -q "versionName='0.4.0'" /tmp/v04-badging.txt
          grep -q "com.zhanggua.app" /tmp/v04-badging.txt
          cp app/build/outputs/apk/debug/app-debug.apk ../../dist/ZhangGua-v0.4-debug.apk
          cd ../..
          (cd work/v04 && zip -qr ../../dist/ZhangGuaAndroid-v0.4-source.zip . -x '*/build/*' '.gradle/*' 'local.properties')
          unzip -t dist/ZhangGua-v0.4-debug.apk >/dev/null
          unzip -l dist/ZhangGua-v0.4-debug.apk | grep -E 'classes.dex|resources.arsc' >/dev/null
          sha256sum dist/ZhangGua-v0.4-debug.apk

      - name: Publish v0.3 and v0.4 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh release view zhanggua-v0.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh release delete zhanggua-v0.3 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release view zhanggua-v0.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh release delete zhanggua-v0.4 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create zhanggua-v0.3 \
            dist/ZhangGua-v0.3-debug.apk \
            dist/ZhangGuaAndroid-v0.3-source.zip \
            --repo "$GITHUB_REPOSITORY" --target main \
            --title "掌卦 Android v0.3 · AI 解卦" \
            --notes "v0.3：加入用户自带 API Key、模型选择、OpenAI Responses / Chat Completions 兼容模式与 App 内 AI 解卦。APK 为已由 GitHub Actions 实际构建并校验的 debug 签名版本。"
          gh release create zhanggua-v0.4 \
            dist/ZhangGua-v0.4-debug.apk \
            dist/ZhangGuaAndroid-v0.4-source.zip \
            --repo "$GITHUB_REPOSITORY" --target main \
            --title "掌卦 Android v0.4 · StickS3 Ritual UI" \
            --notes "v0.4：视觉复刻优先。新增 StickS3 风格启动序列、全屏黑盒扫描线界面、本卦/之卦小屏排版、自制铜钱与启动音效、分层震动反馈，并保留 v0.3 的完整 AI 解卦功能。原固件完整 UI 素材未公开，因此本版为基于公开演示气质的重构，不包含未授权原素材。"

      - name: Show release links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view zhanggua-v0.3 --repo "$GITHUB_REPOSITORY" --json url,tagName,name
          gh release view zhanggua-v0.4 --repo "$GITHUB_REPOSITORY" --json url,tagName,name
