name: Publish ZhangGua v0.6 Verified Artifact

on:
  push:
    branches: ["main"]
    paths: [".zhanggua-v06-artifact-url"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release host
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified private-build artifact
        shell: bash
        run: |
          set -euo pipefail
          URL=$(tr -d '\r\n' < .zhanggua-v06-artifact-url)
          test -n "$URL"
          curl -fL --retry 3 --retry-delay 2 "$URL" -o /tmp/ZhangGua-v0.6-verified.zip
          mkdir -p dist
          unzip -o /tmp/ZhangGua-v0.6-verified.zip -d dist
          test -s dist/ZhangGua-v0.6-release.apk
          test -s dist/ZhangGuaAndroid-v0.6-source.zip
          unzip -t dist/ZhangGua-v0.6-release.apk >/dev/null
          EXPECTED='1f033e073945ea1a566e84dd76159b6d2262a1e0ef17cef9fbf4523029197d69'
          ACTUAL=$(sha256sum dist/ZhangGua-v0.6-release.apk | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED"
          echo "APK_SHA256=$ACTUAL" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view zhanggua-v0.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh release delete zhanggua-v0.6 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create zhanggua-v0.6 \
            dist/ZhangGua-v0.6-release.apk \
            dist/ZhangGuaAndroid-v0.6-source.zip \
            dist/sha256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "掌卦 Android v0.6 · Signed Stable" \
            --notes "v0.6 正式版：修复并强化启动稳定性；异形屏、沉浸式、音频和震动均改为失败不致命；新增启动后静默检查更新与体验设置中的手动检查更新；首次启用独立长期 release 签名。保留 v0.5 的音效/震动/摇动开关、逐爻手动投掷、流畅投币动画、全面屏适配及 AI 解卦。注意：v0.5 及更早版本使用 debug 签名，因此安装 v0.6 前需要先卸载旧版；从 v0.6 起后续正式版可以直接覆盖升级。APK SHA-256: $APK_SHA256"

      - name: Publish update metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p zhanggua
          cat > zhanggua/latest.json <<EOF
          {
            "versionCode": 6,
            "versionName": "0.6.0",
            "title": "掌卦 v0.6 可用",
            "notes": "正式 release 签名；强化启动稳定性；新增自动与手动版本更新检查。",
            "releasePage": "https://github.com/Ryyus/Ryyus.github.io/releases/tag/zhanggua-v0.6",
            "apkUrl": "https://github.com/Ryyus/Ryyus.github.io/releases/download/zhanggua-v0.6/ZhangGua-v0.6-release.apk",
            "sha256": "$APK_SHA256"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zhanggua/latest.json
          git diff --cached --quiet || git commit -m 'Publish ZhangGua v0.6 update metadata'
          git push origin main

      - name: Verify public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view zhanggua-v0.6 --repo "$GITHUB_REPOSITORY" --json url,tagName,name,assets
          gh release download zhanggua-v0.6 --repo "$GITHUB_REPOSITORY" --pattern 'ZhangGua-v0.6-release.apk' --dir /tmp/public-release
          ACTUAL=$(sha256sum /tmp/public-release/ZhangGua-v0.6-release.apk | awk '{print $1}')
          test "$ACTUAL" = "$APK_SHA256"
