name: Publish ZhangGua v0.8 Verified Artifact

on:
  push:
    branches: ["main"]
    paths: [".zhanggua-v08-artifact-url"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release host
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified private-build artifact
        shell: bash
        run: |
          set -euo pipefail
          URL=$(tr -d '\r\n' < .zhanggua-v08-artifact-url)
          test -n "$URL"
          curl -fL --retry 3 --retry-delay 2 "$URL" -o /tmp/ZhangGua-v0.8-verified.zip
          mkdir -p dist
          unzip -o /tmp/ZhangGua-v0.8-verified.zip -d dist
          test -s dist/ZhangGua-v0.8-release.apk
          test -s dist/ZhangGuaAndroid-v0.8-source.zip
          unzip -t dist/ZhangGua-v0.8-release.apk >/dev/null
          EXPECTED='7dcedb3fc945112053d43598943c855fa36b004c16210addd41b55f0a8ef094f'
          ACTUAL=$(sha256sum dist/ZhangGua-v0.8-release.apk | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED"
          echo "APK_SHA256=$ACTUAL" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view zhanggua-v0.8 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh release delete zhanggua-v0.8 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create zhanggua-v0.8 \
            dist/ZhangGua-v0.8-release.apk \
            dist/ZhangGuaAndroid-v0.8-source.zip \
            dist/sha256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "掌卦 Android v0.8 · Physics Coins" \
            --notes "v0.8：新增两种可切换的铜钱动画——经典浮动与物理飞出。物理模式下，三枚铜钱从底部投掷按钮位置抛出，拥有独立初速度、旋转、重力、碰撞分离和阻尼落位，最后仍严格收敛到本爻真实的字/背结果，不改变传统三钱法概率。设置页重做为紧凑分组卡片，主页只显示交互与动画、AI 解卦、版本更新三个入口，具体配置点入后再展开，不再整页铺开。保留 v0.7 的全面屏手势安全区、AI 服务商预设、经文/历史、音效/震动/摇动/逐爻模式。继续使用 v0.6 起的同一正式 release 签名，v0.6/v0.7 可直接覆盖升级。APK SHA-256: $APK_SHA256"

      - name: Publish update metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p zhanggua
          cat > zhanggua/latest.json <<EOF
          {
            "versionCode": 8,
            "versionName": "0.8.0",
            "title": "掌卦 v0.8 可用",
            "notes": "新增经典/物理双投币动画；三枚铜钱可从按钮飞出并物理落位；设置页改为紧凑分组卡片。",
            "releasePage": "https://github.com/Ryyus/Ryyus.github.io/releases/tag/zhanggua-v0.8",
            "apkUrl": "https://github.com/Ryyus/Ryyus.github.io/releases/download/zhanggua-v0.8/ZhangGua-v0.8-release.apk",
            "sha256": "$APK_SHA256"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zhanggua/latest.json
          git diff --cached --quiet || git commit -m 'Publish ZhangGua v0.8 update metadata'
          git push origin main

      - name: Verify public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view zhanggua-v0.8 --repo "$GITHUB_REPOSITORY" --json url,tagName,name,assets
          mkdir -p /tmp/public-release
          gh release download zhanggua-v0.8 --repo "$GITHUB_REPOSITORY" --pattern 'ZhangGua-v0.8-release.apk' --dir /tmp/public-release
          ACTUAL=$(sha256sum /tmp/public-release/ZhangGua-v0.8-release.apk | awk '{print $1}')
          test "$ACTUAL" = "$APK_SHA256"
